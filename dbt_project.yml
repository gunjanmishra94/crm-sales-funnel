name: 'enpal_assessment_project'
version: '1.0.0'
profile: 'enpal_assessment_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  enpal_assessment_project:
    +schema: pipedrive_analytics
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    reporting:
      +materialized: table

seeds:
  enpal_assessment_project:
    +schema: pipedrive_analytics
    funnel_steps:
      +column_types:
        funnel_step: varchar(5)
        kpi_name: varchar(100)
        source_type: varchar(20)
        source_key: varchar(20)
