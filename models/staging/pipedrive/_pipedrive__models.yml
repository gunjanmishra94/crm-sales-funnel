version: 2

models:
  - name: stg_pipedrive__deal_changes
    description: One row per deal field change.
    columns:
      - name: deal_id
        data_tests: [not_null]
      - name: changed_at
        data_tests: [not_null]
      - name: field_key
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['add_time', 'user_id', 'stage_id', 'lost_reason']

  - name: stg_pipedrive__activities
    description: One row per activity. activity_key is the unique key (activity_id is not).
    columns:
      - name: activity_key
        data_tests: [unique, not_null]
      - name: deal_id
        data_tests: [not_null]
      - name: activity_type
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_pipedrive__activity_types')
                field: activity_type
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_pipedrive__users')
                field: user_id

  - name: stg_pipedrive__activity_types
    columns:
      - name: activity_type_id
        data_tests: [unique, not_null]
      - name: activity_type
        data_tests: [unique, not_null]

  - name: stg_pipedrive__stages
    columns:
      - name: stage_id
        data_tests: [unique, not_null]

  - name: stg_pipedrive__users
    columns:
      - name: user_id
        data_tests: [unique, not_null]

  - name: stg_pipedrive__field_options
    description: One row per option of an enum deal field.
    columns:
      - name: field_key
        data_tests: [not_null]
      - name: option_id
        data_tests: [not_null]
